<ion-header>
  <ion-toolbar color="primary">
    <ion-title>Iniciar Sesión</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding" fullscreen>
  <ion-header collapse="condense">
    <ion-toolbar color="primary">
      <ion-title size="larger">Bienvenido</ion-title>
    </ion-toolbar>
  </ion-header>

  <ion-grid>
    <ion-row>
      <ion-col size="12" size-offset="2">
        <ion-card>
          <ion-card-header>
            <ion-card-title>Accede a tu cuenta</ion-card-title>
            <ion-card-subform>Regístrate si no tienes cuenta</ion-card-subform>
          </ion-card-header>

          <ion-card-content>
            <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" novalidate>

              <!-- Email -->
              <ion-item>
                <ion-label position="floating">Correo Electrónico</ion-label>
                <ion-input type="email" formControlName="email" required></ion-input>
              </ion-item>

              <!-- Password -->
              <ion-item>
                <ion-label position="floating">Contraseña</ion-label>
                <ion-input type="password" formControlName="password" required></ion-input>
              </ion-item>

              <!-- Error message -->
              <ion-item *ngIf="errorMessage" color="danger">
                {{ errorMessage }}
              </ion-item>

              <!-- Submit button -->
              <ion-button type="submit" [disabled]="isLoading" expand="full">
                <ion-label *ngIf="!isLoading">Iniciar Sesión</ion-label>
                <ion-spinner *ngIf="isLoading" name="circular" size="medium"></ion-spinner>
                <ion-label *ngIf="isLoading">Iniciando...</ion-label>
              </ion-button>

              <ion-button expand="outline" color="secondary" (click)="forgotPassword()">
                ¿Olvidaste tu contraseña?
              </ion-button>

            </form>
          </ion-card-content>
        </ion-card>
      </ion-col>
    </ion-row>
  </ion-grid>
</ion-content>
